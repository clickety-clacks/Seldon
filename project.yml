name: Seldon
options:
  deploymentTarget:
    iOS: "26.0"
    visionOS: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Seldon:
    type: application
    platform: iOS
    sources:
      - path: Seldon
        excludes:
          - Resources/Info.plist
          - Resources/InfoVision.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seldon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Seldon/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SeldonTests
  SeldonVision:
    type: application
    platform: visionOS
    sources:
      - path: Seldon
        excludes:
          - Resources/Info.plist
          - Resources/InfoVision.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seldon.vision
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Seldon/Resources/InfoVision.plist
    scheme:
      testTargets:
        - SeldonVisionTests
  SeldonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeldonTests
    dependencies:
      - target: Seldon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seldon.tests
        GENERATE_INFOPLIST_FILE: YES
  SeldonVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: SeldonTests
    dependencies:
      - target: SeldonVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seldon.vision.tests
        GENERATE_INFOPLIST_FILE: YES
